const ERRS = {
  ERR_BUSY: 'این کنسول الان آزاد نیست', ERR_MINE: 'همین الان یک درخواست یا بازی فعال داری', ERR_DISABLED: 'این کنسول غیرفعال است',
  ERR_FORBIDDEN: 'اجازه‌ی این کار را نداری', ERR_STATE: 'وضعیت عوض شده؛ صفحه را نگاه کن', ERR_LOGIN: 'اول وارد شو',
  ERR_NOCARD: 'کارت پُر کافی نیست', ERR_NOTFOUND: 'پیدا نشد', ERR_ARG: 'ورودی نامعتبر است', ERR_CANCEL: 'امکان لغو نیست'
};
function perr(e) {
  const m = String((e && e.message) || e);
  for (const k in ERRS) if (m.includes(k)) return ERRS[k];
  if (/Invalid login/i.test(m)) return 'نام کاربری یا رمز اشتباه است';
  if (/already (been )?registered/i.test(m) || /profiles_username_key/.test(m)) return 'این نام کاربری قبلاً گرفته شده';
  if (/rate limit|too many|over_request/i.test(m)) return 'تعداد تلاش زیاد است؛ کمی صبر کن';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'اتصال به سرور برقرار نیست (اینترنت یا فیلترشکن را چک کن)';
  if (/[؀-ۿ]/.test(m) && m.length < 120) return m;
  return 'خطا: ' + m.slice(0, 90);
}
async function raw(path, o = {}) {
  const headers = { apikey: CFG.key, 'Content-Type': 'application/json', ...(o.headers || {}) };
  if (o.auth !== false && S.tok) headers.Authorization = 'Bearer ' + S.tok;
  const r = await fetch(CFG.url + path, { method: o.method || 'GET', headers, body: o.body !== undefined ? JSON.stringify(o.body) : undefined });
  const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) { }
  if (!r.ok) { const err = new Error((j && (j.message || j.msg || j.error_description || j.error)) || ('HTTP ' + r.status)); err.status = r.status; throw err; }
  return j;
}
function setTok(j) { S.tok = j.access_token; S.rt = j.refresh_token; S.exp = Date.now() + (j.expires_in || 3600) * 1000; try { localStorage.setItem(SKEY, S.rt); } catch (e) { } }
function clearSess() { S.tok = S.rt = null; S.session = null; S.lb = {}; S.db.users = []; S.db.sessions = []; try { localStorage.removeItem(SKEY); } catch (e) { } }
let refreshing = null;
function refreshTok() {
  if (!S.rt) return Promise.reject(new Error('ERR_LOGIN'));
  if (!refreshing) refreshing = raw('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: { refresh_token: S.rt }, auth: false })
    .then(j => { setTok(j); return j; }).finally(() => { refreshing = null; });
  return refreshing;
}
async function sb(path, o = {}) {
  if (S.tok && Date.now() > S.exp - 30000) { try { await refreshTok(); } catch (e) { clearSess(); throw e; } }
  try { return await raw(path, o); }
  catch (e) { if (e.status === 401 && S.rt) { await refreshTok(); return raw(path, o); } throw e; }
}
const rest = q => sb('/rest/v1/' + q);

const nowS = () => Date.now() + S.off;
function mapS(r) {
  const go = r.go_at ? Date.parse(r.go_at) : null;
  return { id: r.id, stationId: r.station_id, unitId: r.unit_id, unitLabel: r.unit_label, userId: r.user_id || null, raw: r.status,
    status: r.status === 'approved' ? (nowS() >= go ? 'running' : 'countdown') : r.status, rate: r.rate, goAt: go, startT: go,
    endT: r.end_at ? Date.parse(r.end_at) : null, minutes: r.minutes, cost: r.cost, stamp: r.stamp, cardFull: r.card_full, reqT: Date.parse(r.req_at) };
}
function derive() { S.db.T = nowS(); S.db.sessions.forEach(s => { if (s.raw === 'approved') s.status = S.db.T >= s.goAt ? 'running' : 'countdown'; }); }
async function syncTime() { try { S.off = Date.parse(await rpc('server_time')) - Date.now(); S.lastSync = Date.now(); } catch (e) { } }

async function load() {
  if (Date.now() - S.lastSync > 60000) await syncTime();
  const [st, un, se] = await Promise.all([rest('stations?select=*&order=sort.asc'), rest('units?select=*&order=sort.asc'), rest('settings?select=*')]);
  const cfg = {}; se.forEach(r => { cfg[r.key] = r.value; });
  let users = [], raws = [], busy = [];
  if (S.session) {
    const uid = S.session.userId, admin = S.session.role === 'admin';
    const jobs = [rest(admin ? 'profiles?select=*&order=created_at.asc' : 'profiles?select=*&id=eq.' + q(uid)),
      rest('sessions?select=*&order=req_at.desc&limit=500' + (admin ? '' : '&user_id=eq.' + q(uid)))];
    if (!admin) jobs.push(rpc('get_busy'));
    [users, raws, busy = []] = await Promise.all(jobs);
  }
  const sig = JSON.stringify([st, un, se, users, raws, busy]);
  const changed = sig !== S.sig; S.sig = sig;
  if (!changed) { derive(); return false; }
  const d = S.db;
  d.shop = cfg.shop || d.shop; d.rules = cfg.rules || []; d.loyalty = cfg.loyalty || d.loyalty;
  d.lbResetAt = cfg.lb_reset_at && cfg.lb_reset_at.t ? Date.parse(cfg.lb_reset_at.t) : 0;
  d.stations = st.map(s => ({ id: s.id, label: s.label, room: s.room, shared: s.shared, disabled: s.disabled, sort: s.sort,
    units: un.filter(u => u.station_id === s.id).map(u => ({ id: u.id, type: u.type, price: u.price, sort: u.sort })) }));
  d.users = users.map(p => ({ id: p.id, name: p.username, role: p.role, photo: p.photo, loy: { s1: p.s1, s15: p.s15, c1: p.c1, c15: p.c15 } }));
  d.sessions = raws.map(mapS);
  const mine = new Set(d.sessions.filter(s => ACTIVE.includes(s.status)).map(s => s.unitId));
  busy.forEach(b => { if (!mine.has(b.unit_id)) d.sessions.push(mapS({ id: 'b_' + b.unit_id, station_id: b.station_id, unit_id: b.unit_id, unit_label: '', user_id: null, status: b.status, go_at: b.go_at, req_at: new Date().toISOString() })); });
  derive(); return true;
}

async function toEmail(s) {
  s = String(s).trim().toLowerCase(); if (s.includes('@')) return s;
  const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('gameland:' + s));
  return 'u' + [...new Uint8Array(h)].slice(0, 20).map(x => x.toString(16).padStart(2, '0')).join('') + '@gameland.app';
}
async function enter(uid) {

  if (!p || !p.length) throw new Error('پروفایل پیدا نشد');
  S.session = { userId: uid, role: p[0].role }; S.tab = p[0].role === 'admin' ? 'dash' : 'home'; S.lastAct = Date.now(); S.sig = ''; S.lb = {};
  await load();
}

function unitState(st, u) {
  if (st.disabled) return { k: 'off', t: 'غیرفعال' };
  const s = occ(st, u); if (!s) return { k: 'free', t: 'آزاد' };
  if (s.unitId !== u.id) return { k: 'lock', t: 'تلویزیون مشترک اشغال است' };
  return s.status === 'pending' ? { k: 'pend', t: 'درخواست شده' } : { k: 'run', t: s.status === 'countdown' ? 'در حال شروع…' : 'در حال بازی' };

async function poll() {
  if (document.hidden) return;
  try { if (await load()) { if (typing()) S.dirty = true; else render(); } } catch (e) { if (e && e.status === 401) { clearSess(); render(); } }
}
function setTheme(t) {
  document.documentElement.dataset.theme = t; try { localStorage.setItem('gameland_theme', t); } catch (e) { }
  const b = $('#themeBtn'); b.replaceChildren(icon(t === 'night' ? 'sun' : 'moon')); b.setAttribute('aria-label', t === 'night' ? 'حالت روز' : 'حالت شب');
}
(async function boot() {
  let th = 'night'; try { th = localStorage.getItem('gameland_theme') || 'night'; } catch (e) { } setTheme(th === 'day' ? 'day' : 'night');
  $('#logo').append(icon('gamepad'));
  $('#themeBtn').onclick = () => setTheme(document.documentElement.dataset.theme === 'night' ? 'day' : 'night');
  $('#logout').onclick = async () => { await API.logout(); render(); };
  addEventListener('hashchange', render);
  ['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, () => { S.lastAct = Date.now(); }, { passive: true }));
  addEventListener('focusout', () => setTimeout(() => { if (S.dirty && !typing()) { S.dirty = false; render(); } }, 250));
  await syncTime();
  try { const rt = localStorage.getItem(SKEY); if (rt) { S.rt = rt; const j = await refreshTok(); await enter(j.user.id); } } catch (e) { clearSess(); }
  try { await load(); } catch (e) { toast(perr(e), true); }
  render(); $('#boot').remove();
  setInterval(tick, 250); setInterval(poll, 4000);
})();
</script>
</body></html>
