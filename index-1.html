<!doctype html>
<html lang="fa" dir="rtl" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>گیم لند | نسخه نمایشی</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--r:18px;--font:'Vazirmatn',Tahoma,system-ui,sans-serif}
html[data-theme=night]{--bg:#0a0613;--card:#171028;--card2:#221942;--ink:#f5f0ff;--mut:#b2a5d6;--pri:#a855f7;--pri2:#7c3aed;--onpri:#fff;--acc:#d8b4fe;--line:#33265f;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185;--glow:rgba(124,58,237,.35);--glow2:rgba(168,85,247,.18);--cut:#171028;color-scheme:dark}
html[data-theme=day]{--bg:#fffdf0;--card:#ffffff;--card2:#fff4b8;--ink:#1d1600;--mut:#6a5710;--pri:#facc15;--pri2:#eab308;--onpri:#1d1600;--acc:#8a5a00;--line:#efdc7c;--ok:#15803d;--warn:#b45309;--bad:#be123c;--glow:rgba(250,204,21,.4);--glow2:rgba(253,224,71,.3);--cut:#fff4b8;color-scheme:light}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.65;padding-bottom:92px;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60% 38% at 85% -8%,var(--glow),transparent),radial-gradient(50% 40% at 0 100%,var(--glow2),transparent)}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.ic{display:inline-flex;width:1.25em;height:1.25em;vertical-align:middle}.ic svg{width:100%;height:100%}
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;margin-inline-end:auto}
.logo{--cut:var(--pri2);width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--onpri);display:grid;place-items:center;box-shadow:0 0 22px var(--glow)}
.logo .ic{width:24px;height:24px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.88rem;min-height:36px}
.seg button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--onpri)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center}
.demobar{background:var(--card2);border-bottom:1px solid var(--line);font-size:.82rem;color:var(--mut)}
.demobar .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.demobar select,.demobar button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 10px;min-height:32px;cursor:pointer}
nav.tabs{position:fixed;bottom:0;inset-inline:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;max-width:150px;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;font-size:.74rem;font-weight:600;color:var(--mut);min-height:52px}
nav.tabs button .ic{width:22px;height:22px}
nav.tabs button.on{color:var(--onpri);background:linear-gradient(135deg,var(--pri),var(--pri2))}
main{padding-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card+.card,.card+section,section+.card{margin-top:14px}
h2{font-size:1.15rem;font-weight:800;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
h3{font-size:1rem;font-weight:800}
.mut{color:var(--mut);font-size:.86rem}
.rules{border:1px solid var(--pri);background:linear-gradient(135deg,var(--card2),var(--card));border-radius:var(--r);padding:14px 16px;position:relative;box-shadow:0 0 28px var(--glow)}
.rules h3{display:flex;gap:8px;align-items:center;margin-bottom:6px;color:var(--acc)}
.rules ol{padding-inline-start:26px;list-style:persian}.rules li{margin:2px 0}
.btn{border:0;border-radius:14px;padding:10px 18px;min-height:44px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--onpri);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.sec{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:var(--bad);color:#fff}.btn.ok{background:var(--ok);color:#06150d}
.btn.sm{padding:4px 12px;min-height:36px;font-size:.88rem;border-radius:11px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:999px;border:1px solid currentColor}
.pill.free{color:var(--ok)}.pill.run{color:var(--bad)}.pill.pend{color:var(--warn)}.pill.off,.pill.lock{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.st{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.st.busy{border-color:var(--bad)}.st.free{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.st.vip{grid-column:1/-1;background:linear-gradient(120deg,var(--card2),var(--card));border-color:var(--pri)}
.st-h{display:flex;align-items:center;gap:10px}
.num{min-width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:1.35rem;background:var(--card2);border:1px solid var(--line);padding:0 8px}
.st.free .num{box-shadow:0 0 16px var(--glow)}
.unit{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px}
.badge{font-weight:800;font-size:.8rem;padding:2px 9px;border-radius:8px;background:var(--card2);border:1px solid var(--line)}
.badge.p5{background:var(--pri);color:var(--onpri);border-color:transparent}
.big{font-size:2.4rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px;line-height:1.2}
.live{border-color:var(--pri);box-shadow:0 0 30px var(--glow);text-align:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile b{display:block;font-size:1.4rem}
.loys{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.loy{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.loy-h{display:flex;justify-content:space-between;margin-bottom:10px}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.slot{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;color:var(--mut);font-size:.8rem}
.slot.on{border:2px solid var(--pri);background:var(--card2);color:var(--pri);box-shadow:0 0 14px var(--glow);animation:pop .35s}
.slot .ic{width:62%;height:62%}
html[data-theme=day] .slot.on{color:#9a6a00}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.lb{list-style:none;padding:0}
.lb li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.lb li:last-child{border:0}
.rank{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--card2);flex:none}
.r1{background:#facc15;color:#2b2000}.r2{background:#cbd5e1;color:#1e293b}.r3{background:#d28a4a;color:#2a1400}
input,select{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-height:44px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
label.f{display:block;margin:10px 0 4px;font-weight:600;font-size:.9rem}
.auth{max-width:420px;margin:20px auto}
.err{color:var(--bad);font-size:.88rem;min-height:1.4em;margin-top:6px}
.ed{display:grid;gap:8px;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card2)}
.ed .row>input{flex:1;min-width:90px}.ed .row>select{width:auto}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{padding:8px 6px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
.scroll{overflow-x:auto}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;min-height:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s}
.sw i::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--pri2)}.sw input:checked+i::after{inset-inline-start:23px}
#toast{position:fixed;top:70px;inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90;pointer-events:none}
#toast div{background:var(--card2);border:1px solid var(--pri);padding:10px 18px;border-radius:14px;box-shadow:0 6px 30px rgba(0,0,0,.35);animation:pop .25s;max-width:92vw}
#toast div.bad{border-color:var(--bad)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:grid;place-items:center;padding:16px}
.modal{background:var(--card);border:1px solid var(--pri);border-radius:var(--r);padding:18px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.modal .row{margin-top:14px;justify-content:flex-end}
#boot{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:100;font-weight:700}
.deco{position:absolute;inset-inline-end:-8px;top:-8px;opacity:.09;font-size:70px;pointer-events:none}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
@media(min-width:768px){
 body{padding-bottom:30px}
 nav.tabs{position:sticky;top:61px;bottom:auto;inset-inline:auto;border:0;border-bottom:1px solid var(--line);justify-content:flex-start;padding:8px 16px}
 nav.tabs button{flex-direction:row;gap:8px;max-width:none;flex:none;padding:6px 18px;font-size:.9rem;min-height:44px}
}
@media(max-width:480px){.big{font-size:2rem}.tools{width:100%;justify-content:space-between}.slots{gap:5px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<header class="top"><div class="wrap">
 <div class="brand"><span class="logo" id="logo"></span><span id="shopname">گیم لند</span></div>
 <div class="tools">
  <div class="seg" id="demoseg" role="group" aria-label="حالت نمایشی"><button id="dUser">نمایش مشتری</button><button id="dAdmin">نمایش مدیر</button></div>
  <button class="iconbtn" id="themeBtn" aria-label="تغییر شب و روز"></button>
 </div>
</div></header>
<div class="demobar" id="demobar"><div class="wrap">
 <span>حالت نمایشی: داده‌ها فقط روی همین مرورگر می‌مانند.</span>

 <button id="resetBtn">بازنشانی داده‌ها</button>
</div></div>
<nav class="tabs" id="nav" aria-label="منو"></nav>
<main class="wrap" id="app"></main>

/* ---------- crypto (PBKDF2, per-user salt) ---------- */
async function hashPw(pw, salt) {
  if (!(window.crypto && crypto.subtle)) { let x = 5381; for (const c of salt + pw) x = ((x << 5) + x + c.charCodeAt(0)) | 0; return 'weak' + x; } // demo fallback only
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return b64e(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64d(salt), iterations: 100000 }, key, 256));
}
const newSalt = () => b64e(crypto.getRandomValues(new Uint8Array(16)));
const safeEq = (a, b) => { if (a.length !== b.length) return false; let r = 0; for (let i = 0; i < a.length; i++) r |= a.charCodeAt(i) ^ b.charCodeAt(i); return r === 0; };

async function seed() {

  const mk = async (name, role, pw) => { const salt = newSalt(); return { id: 'u_' + uid(), name, role, salt, hash: await hashPw(pw, salt), photo: null, loy: { s1: 0, s15: 0, c1: 0, c15: 0 } }; };
  const admin = await mk('admin', 'admin', ADMIN_PW), demo = await mk('demo_player', 'user', DEMO_PW);
  admin.id = 'u_admin'; demo.id = 'u_demo'; demo.loy = { s1: 4, s15: 3, c1: 0, c15: 1 };
  const names = ['Reza_X', 'Sara_Gamer', 'Ali_PS', 'Mahdi77', 'Kian', 'Niloofar', 'Amir_FIFA', 'Parsa'];
  const others = []; for (const n of names) { const u = await mk(n, 'user', DEMO_PW); u.loy = { s1: Math.floor(Math.random() * 6), s15: Math.floor(Math.random() * 6), c1: Math.floor(Math.random() * 2), c15: Math.floor(Math.random() * 2) }; others.push(u); }
  const users = [admin, demo, ...others];
  const mkSt = (id, label, units, extra = {}) => ({ id, label, shared: true, disabled: false, room: false, units: units.map(t => ({ id: id + '-' + t, type: t, price: t === 'ps5' ? 110000 : 80000 })), ...extra });
  const stations = ['۱', '۲', '۳', '۴', '۵'].map((l, i) => mkSt('s' + (i + 1), l, ['ps4']));
  stations.push(mkSt('s6', '۶', ['ps4', 'ps5']), mkSt('s6p', '۶+', ['ps4', 'ps5']), mkSt('s7', '۷', ['ps4']), mkSt('s8', '۸', ['ps4']), mkSt('vip', 'اتاق VIP', ['ps4'], { room: true }));
  let seedv = 7; const rnd = () => { seedv |= 0; seedv = seedv + 0x6D2B79F5 | 0; let t = Math.imul(seedv ^ seedv >>> 15, 1 | seedv); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const units = stations.flatMap(s => s.units.map(u => ({ s, u })));
  const sessions = [], durs = [30, 45, 60, 60, 75, 90, 90, 120, 150, 180];
  for (let i = 0; i < 52; i++) {
    const u = others.concat(demo)[Math.floor(rnd() * rnd() * 9)], su = units[Math.floor(rnd() * units.length)];
    const dur = durs[Math.floor(rnd() * durs.length)], day = i < 7 ? 0 : Math.floor(rnd() * 30);
    const endT = day === 0 ? T0 - 36e5 * (0.5 + rnd() * 6) : T0 - day * 864e5 - rnd() * 8 * 36e5;
    sessions.push({ id: uid(), stationId: su.s.id, unitId: su.u.id, userId: u.id, status: 'done', startT: endT - dur * 6e4, endT, rate: su.u.price, minutes: dur, cost: Math.round(su.u.price * dur / 60) });
  }
  const rz = others[0], sg = others[1];
  sessions.push({ id: uid(), stationId: 's3', unitId: 's3-ps4', userId: rz.id, status: 'running', startT: T0 - 25 * 6e4, rate: 80000 });
  sessions.push({ id: uid(), stationId: 's7', unitId: 's7-ps4', userId: sg.id, status: 'pending', reqT: T0 });
  return { v: 1, T: T0, shop: { name: 'گیم لند', tagline: 'بهترین جا برای بازی PS4 و PS5' }, rules: ['بابت افتادن دسته ۴۰۰ هزار تومان گرفته می‌شود', 'بعد از بازی کنسول را خاموش نکنید', 'از صدای بلند یا آزاردهنده دوری کنید'].map(t => ({ id: uid(), text: t })), loyalty: { slots: 6, need15: 2, r1: '۱ ساعت بازی رایگان', r15: 'بردن کنسول به خانه برای ۱۲ ساعت' }, stations, users, sessions, lbResetAt: 0 };
}

const API = {
  async signup(name, pw, photo) {

    if (String(pw).length < 8 || pw.length > 64) throw new Error('رمز باید ۸ تا ۶۴ کاراکتر باشد');
    if (S.db.users.some(u => u.name.toLowerCase() === name.toLowerCase())) throw new Error('این نام کاربری قبلاً گرفته شده');
    const salt = newSalt(); const u = { id: 'u_' + uid(), name, role: 'user', salt, hash: await hashPw(pw, salt), photo: photo || null, loy: { s1: 0, s15: 0, c1: 0, c15: 0 } };

  },
  async login(name, pw) {

    const u = S.db.users.find(x => x.name.toLowerCase() === k);
    const hsh = await hashPw(String(pw), u ? u.salt : 'AAAAAAAAAAAAAAAAAAAAAA==');
    if (!u || !safeEq(hsh, u.hash)) { S.fails[k] = (S.fails[k] || 0) + 1; if (S.fails[k] >= 5) { S.lock[k] = now + 60000; S.fails[k] = 0; } throw new Error('نام کاربری یا رمز اشتباه است'); }
    S.fails[k] = 0; return u;
  },
  setPhoto(p) { need('user'); me().photo = p; save(); },
  request(unitId) {
    need('user'); const st = stOf(unitId), u = unitOf(unitId);
    if (!st || !u) throw new Error('کنسول پیدا نشد');
    if (st.disabled) throw new Error('این کنسول غیرفعال است');
    if (occ(st, u)) throw new Error('این کنسول الان آزاد نیست');
    if (activeOf(S.session.userId)) throw new Error('همین الان یک درخواست یا بازی فعال داری');
    S.db.sessions.push({ id: uid(), stationId: st.id, unitId, userId: S.session.userId, status: 'pending', reqT: S.db.T }); save();
  },
  cancel(sid) { need('user'); const s = sessOf(sid); if (!s || s.userId !== S.session.userId || s.status !== 'pending') throw new Error('امکان لغو نیست'); s.status = 'rejected'; s.note = 'لغو توسط مشتری'; save(); },
  approve(sid) {
    need('admin'); const s = sessOf(sid); if (!s || s.status !== 'pending') throw new Error('این درخواست دیگر در انتظار نیست');
    const st = stOf(s.unitId), u = unitOf(s.unitId); if (!st || !u || st.disabled) throw new Error('کنسول غیرفعال یا حذف شده');
    if (S.db.sessions.some(x => x !== s && x.stationId === st.id && ['countdown', 'running'].includes(x.status) && (st.shared || x.unitId === s.unitId))) throw new Error('این کنسول هم‌اکنون در حال بازی است');

  reject(sid) { need('admin'); const s = sessOf(sid); if (!s || s.status !== 'pending') throw new Error('درخواست در انتظار نیست'); s.status = 'rejected'; s.note = 'رد توسط مدیر'; save(); },
  stop(sid) {

    if (s.status === 'countdown') { s.status = 'rejected'; s.note = 'لغو قبل از شروع'; save(); return s; }

  /* consoles */

  addStation(label, room) { need('admin'); label = cleanText(label, 20); if (S.db.stations.some(s => s.label === label)) throw new Error('این نام قبلاً هست'); const id = 's' + uid(); S.db.stations.push({ id, label, room: !!room, shared: true, disabled: false, units: [{ id: id + '-ps4', type: 'ps4', price: 80000 }] }); save(); },

  /* settings */

  addRule(t) { need('admin'); S.db.rules.push({ id: uid(), text: cleanText(t, 140) }); save(); },
  editRule(id, t) { need('admin'); S.db.rules.find(r => r.id === id).text = cleanText(t, 140); save(); },
  delRule(id) { need('admin'); S.db.rules = S.db.rules.filter(r => r.id !== id); save(); },
  setLoy(k, v) {
    need('admin'); const L = S.db.loyalty;

  const b = $('#themeBtn'); b.replaceChildren(icon(t === 'night' ? 'sun' : 'moon')); b.setAttribute('aria-label', t === 'night' ? 'حالت روز' : 'حالت شب');

function demoAs(role) { S.demo = true; S.session = role === 'admin' ? { userId: 'u_admin', role } : { userId: 'u_demo', role }; S.tab = role === 'admin' ? 'dash' : 'home'; render(); }
(async function boot() {
  try { S.db = load() || await seed(); } catch (e) { S.db = await seed(); }
  S.db.T = Math.max(S.db.T, Date.now()); S.lastReal = Date.now(); save();
  let th = 'night'; try { th = localStorage.getItem('gameland_theme') || 'night'; } catch (e) { } setTheme(th === 'day' ? 'day' : 'night');
  $('#logo').append(icon('gamepad'));
  $('#themeBtn').onclick = () => setTheme(document.documentElement.dataset.theme === 'night' ? 'day' : 'night');
  $('#dUser').onclick = () => demoAs('user'); $('#dAdmin').onclick = () => demoAs('admin');
  $('#speed').onchange = e => { S.speed = [1, 60, 300].includes(+e.target.value) ? +e.target.value : 1; };
  $('#resetBtn').onclick = () => modal('بازنشانی داده‌های نمایشی؟', h('p', { class: 'mut' }, 'همه‌ی داده‌ها به حالت اول برمی‌گردد.'), [{ label: 'بله', cls: 'bad', fn: async () => { try { localStorage.removeItem(LS); } catch (e) { } S.db = await seed(); demoAs('user'); } }, { label: 'نه', cls: 'sec' }]);
  ['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, () => { S.lastAct = Date.now(); }, { passive: true }));
  demoAs('user'); $('#boot').remove(); setInterval(tick, 250);
})();
</script>
